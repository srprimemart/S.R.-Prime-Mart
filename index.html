<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Prime Mart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- টপ হেডার সেকশন (হোয়াইট ও গ্রিন থিম) -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="logo.jpg" alt="SR Prime Mart" class="logo-img" onerror="this.style.display='none'">
                <span class="brand-name">SR Prime Mart</span>
            </div>

            <div class="search-area">
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>

            <div class="header-right">
                <div class="contact-info">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <small>LET'S TALK</small>
                        <span>01856575222</span>
                    </div>
                </div>
                <!-- কার্ট আইকন ও ব্যাজ -->
                <div class="cart-icon-btn" onclick="openCartModal()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- নেভিগেশন বার -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="#" class="nav-link active">Home</a>
            <a href="#products-section" class="nav-link">All Products</a>
        </div>
    </nav>

    <!-- মেইন কনটেন্ট (প্রোডাক্ট গ্রিড) -->
    <main class="main-container">
        <section id="products-section" class="products-section">
            <h2 class="section-title">All Products</h2>
            <div id="product-container" class="product-grid"></div>
        </section>
    </main>

    <!-- পূর্ণাঙ্গ কার্ট ও চেকআউট পপ-আপ মডাল -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>আপনার শপিং কার্ট</h2>
            
            <div class="cart-layout">
                <!-- বাম পাশ: কার্টে থাকা প্রোডাক্টের তালিকা ও ছবি -->
                <div class="cart-items-section">
                    <div id="cartItemsContainer">
                        <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে কার্টের প্রোডাক্টগুলো ছবিসহ যোগ হবে -->
                    </div>
                    
                    <!-- ডেলিভারি চার্জ অপশন -->
                    <div class="delivery-options">
                        <label>ডেলিভারি এলাকা নির্বাচন করুন:</label>
                        <select id="deliveryLocation" onchange="updateTotal()">
                            <option value="170">ইনসাইড ঢাকা (১৭০ টাকা)</option>
                            <option value="130">আউটসাইড ঢাকা (১৩০ টাকা)</option>
                            <option value="110">সাব এরিয়া (১১০ টাকা)</option>
                        </select>
                    </div>

                    <!-- হিসাব-নিকাশ -->
                    <div class="cart-summary-box">
                        <div class="summary-row"><span>সাবটোটাল:</span> <span id="subTotal">৳0</span></div>
                        <div class="summary-row"><span>ডেলিভারি চার্জ:</span> <span id="deliveryCharge">৳170</span></div>
                        <div class="summary-row total-row"><span>সর্বমোট:</span> <span id="grandTotal">৳170</span></div>
                    </div>
                </div>

                <!-- ডান পাশ: কাস্টমার ইনফো ও অর্ডার ফর্ম -->
                <div class="checkout-form-section">
                    <form id="orderForm">
                        <div class="form-group">
                            <label>আপনার নাম:</label>
                            <input type="text" id="customerName" name="Name" placeholder="আপনার পুরো নাম লিখুন" required>
                        </div>

                        <div class="form-group">
                            <label>ফোন নম্বর:</label>
                            <input type="tel" id="customerPhone" name="Phone" placeholder="০1XXXXXXXXX" required>
                        </div>

                        <div class="form-group">
                            <label>থানা ও সম্পূর্ণ ঠিকানা:</label>
                            <textarea id="customerAddress" name="Address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn">പ്লেস অর্ডার (Place Order)</button>
                    </form>

                    <div id="successMessage" class="success-message" style="display: none;">
                        ✅ আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!<br>
                        অর্ডারটি কনফার্ম করার জন্য আমাদের টিম খুব দ্রুত আপনার নাম্বারে যোগাযোগ করবে। ধন্যবাদ!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

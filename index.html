<!-- Payment Method Cards -->
<div class="form-group" style="margin-top: 20px;">
    <label style="font-weight: 700; font-size: 15px; margin-bottom: 12px; display: block; color: #1f2937;">
        <i class="fa-solid fa-wallet" style="color: #ea580c; margin-right: 6px;"></i> Payment *
    </label>
    
    <div class="payment-stack">
        
        <!-- 1. Cash on Delivery -->
        <label class="pay-row-card">
            <input type="radio" name="PaymentMethod" value="Cash on Delivery" checked>
            <div class="pay-img-box cod-bg">
                <i class="fa-solid fa-money-bill-wave"></i>
            </div>
            <div class="pay-details">
                <div class="pay-title">Cash on delivery</div>
                <div class="pay-sub">Pay with cash upon delivery.</div>
            </div>
        </label>

        <!-- 2. bKash Payment -->
        <label class="pay-row-card">
            <input type="radio" name="PaymentMethod" value="bKash">
            <div class="pay-img-box bkash-bg">
                <img src="bkash.jpg" alt="bKash" onerror="this.src='bkash.JPG'">
            </div>
            <div class="pay-details">
                <div class="pay-title">bKash Payment Gateway</div>
            </div>
        </label>

        <!-- 3. Nagad Payment -->
        <label class="pay-row-card">
            <input type="radio" name="PaymentMethod" value="Nagad">
            <div class="pay-img-box nagad-bg">
                <img src="nagad.jpg" alt="Nagad" onerror="this.src='nagad.JPG'">
            </div>
            <div class="pay-details">
                <div class="pay-title">Nagad</div>
                <div class="pay-sub">Pay Through Nagad</div>
            </div>
        </label>

    </div>
</div>
